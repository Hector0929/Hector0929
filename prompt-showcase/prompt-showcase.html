<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <script src="../assets/js/lab-shell.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI 修圖與提示詞案例庫 · Hector's Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap">
  <style>
    /* Hector's Lab 淺色設計規範 */
    :root {
      --bg: #f3f3f6;
      --surface: #ffffff;
      --surface-subtle: #f8f8fb;
      --surface-sunk: #ebebf0;
      --border: rgba(0, 0, 0, 0.07);
      --ink: #1d1d1f;
      --ink-2: #6b6f76;
      --ink-3: #8e9198;
      --accent: #c83e7b;
      --accent-bg: #fcebf3;
      --accent-glow: rgba(200, 62, 123, 0.22);
      --mint: #1fa98a;
      --code-ink: #2d3139;
      --shadow: 0 1px 2px rgba(20, 30, 60, .04), 0 6px 24px rgba(20, 30, 60, .07);
      --shadow-hover: 0 2px 4px rgba(20, 30, 60, .05), 0 16px 40px rgba(20, 30, 60, .14);
      --radius: 20px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;

      /* 五模組顏色 */
      --m-fmt: #0a72e8;      --m-fmt-bg: #e8f1fd;
      --m-top: #1f8f75;      --m-top-bg: #e4f5f0;
      --m-bot: #c83e7b;      --m-bot-bg: #fcebf3;
      --m-typo: #7a4fd0;     --m-typo-bg: #f0eafb;
      --m-neg: #6b6f76;      --m-neg-bg: #efeff3;
      --m-misc: #b0700f;     --m-misc-bg: #fbf1e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--f-body);
      line-height: 1.6;
      padding: 36px 16px 80px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    body:has(dialog[open]) { overflow: hidden; }

    button { font: inherit; color: inherit; }

    .container { max-width: 1120px; margin: 0 auto; }

    /* ── 頁首 ── */
    header { text-align: center; margin-bottom: 24px; }

    header h1 {
      font-family: var(--f-display);
      font-size: clamp(26px, 4vw, 38px);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      text-wrap: balance;
    }

    header p { color: var(--ink-2); font-size: 15px; text-wrap: pretty; }

    .schema {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      font-size: 12px;
      color: var(--ink-3);
    }
    .schema-label { margin-right: 2px; }

    /* 模組色塊（頁首與詳情共用） */
    .mod {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .mod-fmt  { color: var(--m-fmt);  background: var(--m-fmt-bg); }
    .mod-top  { color: var(--m-top);  background: var(--m-top-bg); }
    .mod-bot  { color: var(--m-bot);  background: var(--m-bot-bg); }
    .mod-typo { color: var(--m-typo); background: var(--m-typo-bg); }
    .mod-neg  { color: var(--m-neg);  background: var(--m-neg-bg); }
    .mod-misc { color: var(--m-misc); background: var(--m-misc-bg); }

    /* ── 分類篩選 ── */
    .filter-bar {
      position: sticky;
      top: calc(var(--lab-bar, 0px) + 8px);
      z-index: 20;
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto 28px;
      padding: 5px;
      background: rgba(255, 255, 255, 0.82);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      backdrop-filter: saturate(180%) blur(16px);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow);
    }

    .cat-btn {
      background: none;
      border: 0;
      color: var(--ink-2);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }
    .cat-btn:hover { color: var(--ink); background: var(--surface-subtle); }
    .cat-btn .count { font-weight: 500; opacity: .6; margin-left: 3px; font-variant-numeric: tabular-nums; }
    .cat-btn.active { background: var(--accent); color: #fff; box-shadow: 0 4px 14px var(--accent-glow); }
    .cat-btn.active .count { opacity: .8; }

    @media (max-width: 599px) {
      .filter-bar {
        flex-wrap: nowrap;
        overflow-x: auto;
        justify-content: flex-start;
        scrollbar-width: none;
        width: auto;
        border-radius: 16px;
      }
      .filter-bar::-webkit-scrollbar { display: none; }
    }

    /* ── 作品牆 ── */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    @media (min-width: 900px) {
      .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
    }

    .card {
      position: relative;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease;
      outline: none;
    }
    .card:hover, .card:focus-visible { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
    .card:focus-visible { box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow-hover); }

    .card-media {
      position: relative;
      aspect-ratio: 3 / 4;
      background: var(--surface-sunk);
      overflow: hidden;
    }
    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .5s ease;
    }
    .card:hover .card-media img { transform: scale(1.035); }

    .card-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(29, 29, 31, 0.72);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      pointer-events: none;
    }

    .quick-copy {
      position: absolute;
      top: 10px;
      right: 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border: 0;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity .2s, transform .2s, background .2s, color .2s;
    }
    .card:hover .quick-copy, .card:focus-within .quick-copy { opacity: 1; transform: none; }
    .quick-copy:hover { background: #fff; }
    .quick-copy.copied { background: var(--mint); color: #fff; opacity: 1; transform: none; }
    @media (hover: none) {
      .quick-copy { opacity: 1; transform: none; padding: 6px 9px; }
      .quick-copy .qc-text { display: none; }
      .quick-copy.copied .qc-text { display: inline; }
    }

    .card-body { padding: 14px 16px 16px; }
    .card-cat {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 3px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .card-cat .ratio { color: var(--ink-3); font-weight: 600; font-variant-numeric: tabular-nums; }
    .card-title {
      font-family: var(--f-display);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.35;
      text-wrap: balance;
    }
    .card-sub {
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 599px) {
      .card-body { padding: 10px 12px 12px; }
      .card-title { font-size: 14px; }
      .card-sub { display: none; }
      .card-cat { font-size: 11px; }
    }

    /* ── 無成果圖時的概念預覽（Case 02 紙雕） ── */
    .mock-poster {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      font-family: Georgia, serif;
    }
    .mock-papercut-top {
      flex: 1;
      background: linear-gradient(180deg, #5b768e 0%, #879ba9 50%, #c4b8a7 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .mock-papercut-top::before {
      content: "";
      position: absolute;
      top: 20%;
      left: 60%;
      width: 18%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, #fde4c3 0%, rgba(253,228,195,0) 70%);
      opacity: .8;
    }
    .mock-papercut-top-label {
      color: rgba(255,255,255,.75);
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 600;
      z-index: 2;
      background: rgba(0,0,0,.25);
      padding: 4px 10px;
      border-radius: 4px;
    }
    .mock-papercut-bottom {
      flex: 1;
      background: #fbf8f2;
      background-image: radial-gradient(#ece4d6 1px, transparent 1px);
      background-size: 8px 8px;
      position: relative;
      padding: 8%;
      overflow: hidden;
    }
    .papercut-editorial { position: relative; z-index: 5; }
    .papercut-title { font-size: clamp(12px, 2.4vw, 18px); line-height: 1.15; color: #272320; font-weight: 700; margin-bottom: 4px; }
    .papercut-subtitle { font-family: var(--mono); font-size: 8px; letter-spacing: 2px; color: #7b7169; font-weight: 600; }
    .papercut-diorama-layers { position: absolute; inset: auto 0 0 0; height: 66%; z-index: 3; }
    .paper-layer { position: absolute; bottom: 0; left: 0; right: 0; }
    .paper-layer-1 { height: 92%; background: #ded5c7; clip-path: polygon(0% 45%, 30% 25%, 65% 42%, 100% 20%, 100% 100%, 0% 100%); }
    .paper-layer-2 { height: 68%; background: #cbbeab; clip-path: polygon(0% 30%, 40% 48%, 75% 22%, 100% 38%, 100% 100%, 0% 100%); }
    .paper-layer-3 { height: 40%; background: #b5a48e; clip-path: polygon(0% 22%, 28% 40%, 60% 16%, 100% 32%, 100% 100%, 0% 100%); }
    .placeholder-poster {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--ink-3);
      font-size: 13px;
      background: repeating-linear-gradient(45deg, #ececf1 0 12px, #e6e6ec 12px 24px);
    }

    /* ── 詳情面板 ── */
    dialog.detail {
      border: 0;
      padding: 0;
      margin: auto;
      width: min(1120px, calc(100vw - 48px));
      height: min(880px, calc(100dvh - 48px));
      max-width: none;
      max-height: none;
      border-radius: 24px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 30px 80px rgba(10, 15, 30, .35);
      overflow: hidden;
    }
    dialog.detail::backdrop {
      background: rgba(18, 20, 28, .55);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    dialog.detail[open] { animation: pop .22s ease; }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { dialog.detail[open] { animation: none; } }

    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      height: 100%;
    }

    .detail-media {
      background: var(--surface-sunk);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      min-height: 0;
    }
    .detail-media .frame {
      position: relative;
      height: 100%;
      max-height: 100%;
      aspect-ratio: 3 / 4;
      max-width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(20, 30, 60, .22);
      background: var(--surface-sunk);
    }
    .detail-media .frame.zoomable { cursor: zoom-in; }
    .detail-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .detail-media .zoom-hint {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: rgba(29,29,31,.72);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      pointer-events: none;
    }

    .detail-side { display: flex; flex-direction: column; min-height: 0; }

    .detail-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 18px 10px 26px;
    }
    .detail-counter { font-size: 12px; color: var(--ink-3); font-weight: 600; font-variant-numeric: tabular-nums; }
    .detail-nav { display: flex; gap: 6px; }
    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 15px;
      color: var(--ink-2);
      transition: background .15s, color .15s;
    }
    .icon-btn:hover { background: var(--surface-subtle); color: var(--ink); }
    .icon-btn:disabled { opacity: .35; cursor: default; }

    .detail-scroll { overflow-y: auto; padding: 0 26px 28px; flex: 1; min-height: 0; }

    .detail-cat { font-size: 12px; font-weight: 700; color: var(--accent); display: flex; gap: 8px; align-items: center; }
    .detail-cat .ratio { color: var(--ink-3); }
    .detail-title {
      font-family: var(--f-display);
      font-size: clamp(21px, 2.4vw, 26px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-top: 4px;
      text-wrap: balance;
    }
    .detail-en { font-size: 13.5px; color: var(--ink-3); margin-top: 2px; }
    .detail-desc { font-size: 14.5px; color: var(--ink-2); margin-top: 12px; text-wrap: pretty; }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .detail-tag { font-size: 12px; color: var(--ink-2); background: var(--surface-subtle); border: 1px solid var(--border); padding: 2px 9px; border-radius: 999px; }
    .detail-caption { font-size: 12.5px; color: var(--ink-3); margin-top: 10px; }

    .detail-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 12px;
      padding: 9px 16px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: background .15s, box-shadow .15s, color .15s;
    }
    .btn:hover { background: var(--surface-subtle); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 6px 18px var(--accent-glow); }
    .btn-primary:hover { background: #b5346d; }
    .btn.copied { background: var(--mint); border-color: var(--mint); color: #fff; box-shadow: none; }

    .tabs {
      display: flex;
      gap: 4px;
      margin: 24px 0 14px;
      background: #efeff4;
      padding: 4px;
      border-radius: 12px;
      width: fit-content;
    }
    .tab {
      background: none;
      border: 0;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
      border-radius: 9px;
      cursor: pointer;
    }
    .tab:hover { color: var(--ink); }
    .tab[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

    /* 提示詞模組 */
    .module {
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 10px;
      background: var(--surface);
      overflow: hidden;
    }
    .module > summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px 9px 12px;
      cursor: pointer;
      user-select: none;
    }
    .module > summary::-webkit-details-marker { display: none; }
    .module > summary .chev { color: var(--ink-3); font-size: 11px; transition: transform .2s; width: 12px; }
    .module[open] > summary .chev { transform: rotate(90deg); }
    .module > summary .mod { white-space: normal; }
    .module .mod-copy {
      margin-left: auto;
      border: 0;
      background: none;
      color: var(--ink-3);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 7px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .module .mod-copy:hover { background: var(--surface-subtle); color: var(--ink); }
    .module .mod-copy.copied { color: var(--mint); }
    .module pre {
      margin: 0;
      padding: 2px 14px 14px 32px;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--code-ink);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .code-block {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--code-ink);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* 中文解析 */
    .md h4 { font-size: 15px; font-weight: 700; margin: 4px 0 10px; }
    .md ul { padding-left: 18px; margin: 0; }
    .md li { font-size: 14px; color: var(--ink); margin: 5px 0; line-height: 1.65; }
    .md li li { color: var(--ink-2); font-size: 13.5px; }
    .md li::marker { color: var(--ink-3); }
    .md p { font-size: 14px; margin: 8px 0; }
    .md code { font-family: var(--mono); font-size: 12px; background: var(--surface-sunk); padding: 1px 6px; border-radius: 5px; }

    @media (max-width: 759px) {
      dialog.detail {
        width: 100vw;
        height: 100dvh;
        border-radius: 0;
      }
      .detail-grid { display: block; height: 100%; overflow-y: auto; }
      .detail-media { padding: 16px 16px 4px; background: var(--surface); }
      .detail-media .frame { height: auto; width: min(100%, 420px); }
      .detail-side { display: block; }
      .detail-top {
        position: sticky;
        top: 0;
        z-index: 3;
        padding: max(10px, env(safe-area-inset-top)) 12px 10px 16px;
        background: rgba(255,255,255,.9);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
      }
      .detail-scroll { overflow: visible; padding: 0 16px 40px; }
      .module pre { padding-left: 14px; }
    }

    /* ── Lightbox（放在 dialog 內，才能疊在面板之上） ── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 18, 0.94);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      padding: 24px;
      cursor: zoom-out;
    }
    .lightbox.active { opacity: 1; pointer-events: auto; }
    .lightbox img { max-width: 94vw; max-height: 90vh; border-radius: 8px; object-fit: contain; box-shadow: 0 24px 60px rgba(0,0,0,.8); }
    .lightbox-close {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      color: #fff;
      font-size: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .empty { text-align: center; color: var(--ink-3); padding: 60px 0; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Prompt Showcase · 提示詞與成果庫</h1>
      <p>點作品看完整提示詞與解析，或直接一鍵複製</p>
      <div class="schema" aria-label="提示詞五模組架構">
        <span class="schema-label">每則提示詞都由五個模組組成：</span>
        <span class="mod mod-fmt">FORMAT</span>
        <span class="mod mod-top">TOP HALF</span>
        <span class="mod mod-bot">BOTTOM HALF</span>
        <span class="mod mod-typo">TYPOGRAPHY</span>
        <span class="mod mod-neg">NEGATIVE</span>
      </div>
    </header>

    <nav class="filter-bar" id="filterBar" aria-label="分類篩選"></nav>

    <main class="gallery" id="gallery"></main>
  </div>

    // ── 設定 ──

    // 有成果圖的排前面，概念預覽排最後
    const items = [...showcaseData].sort((a, b) => (b.image ? 1 : 0) - (a.image ? 1 : 0));

    let currentCat = "all";
    let visible = items;
    let currentIndex = -1;

    // ── 工具 ──
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // "3:4 畫廊風 3D 破框海報 (Gallery Split 3D Pop-out)" → { ratio, zh, en }
    function splitTitle(title) {
      let rest = title.trim();
      let ratio = "";
      const r = rest.match(/^(\d+:\d+)\s*/);
      if (r) { ratio = r[1]; rest = rest.slice(r[0].length); }
      let en = "";
      const p = rest.match(/\s*\(([^()]+)\)\s*$/);
      if (p) { en = p[1]; rest = rest.slice(0, p.index); }
      if (!ratio) {
        const m = (showcaseData.find(i => i.title === title)?.prompt || "").match(/--ar\s+(\d+:\d+)/);
        if (m) ratio = m[1];
      }
      return { ratio, zh: rest.trim(), en };
    }

    function moduleKind(name) {
      const n = name.toUpperCase();
      const has = (w) => new RegExp(`\\b${w}\\b`).test(n);
      if (has("TOP HALF") || has("SOURCE") || has("PHOTOGRAPHIC")) return "top";
      if (has("BOTTOM HALF")) return "bot";
      if (has("TYPOGRAPHY")) return "typo";
      if (has("NEGATIVE") || has("PARAMS")) return "neg";
      if (has("FORMAT") || has("RATIO")) return "fmt";
      return "misc";
    }

    // 依 [SECTION] 標題拆成模組
    function parsePrompt(prompt) {
      const parts = [];
      const re = /^\[([^\]\n]+)\]\s*$/gm;
      let m, last = null, lastEnd = 0;
      while ((m = re.exec(prompt))) {
        if (last) parts.push({ name: last, body: prompt.slice(lastEnd, m.index).trim() });
        else if (m.index > 0 && prompt.slice(0, m.index).trim()) parts.push({ name: "", body: prompt.slice(0, m.index).trim() });
        last = m[1].trim();
        lastEnd = re.lastIndex;
      }
      if (last) parts.push({ name: last, body: prompt.slice(lastEnd).trim() });
      if (!parts.length) parts.push({ name: "", body: prompt.trim() });
      return parts;
    }

    function inlineMd(s) {
      return escapeHtml(s)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, "<code>$1</code>");
    }

    // 只處理本資料用到的 Markdown：### 標題、* / - 兩層清單、粗體、行內 code
    function renderMarkdown(md) {
      let html = "";
      let depth = 0; // 0 = 不在清單，1 = 第一層，2 = 第二層
      const closeTo = (d) => {
        while (depth > d) { html += depth === 2 ? "</li></ul>" : "</li></ul>"; depth--; }
      };
      md.split("\n").forEach(line => {
        const h = line.match(/^#{1,6}\s+(.*)$/);
        const top = line.match(/^[*-]\s+(.*)$/);
        const sub = line.match(/^\s{2,}[*-]\s+(.*)$/);
        if (h) { closeTo(0); html += `<h4>${inlineMd(h[1])}</h4>`; }
        else if (sub && depth >= 1) {
          if (depth === 1) { html += "<ul>"; depth = 2; } else { html += "</li>"; }
          html += `<li>${inlineMd(sub[1])}`;
        }
        else if (top) {
          closeTo(1);
          if (depth === 0) { html += "<ul>"; depth = 1; } else { html += "</li>"; }
          html += `<li>${inlineMd(top[1])}`;
        }
        else if (line.trim()) { closeTo(0); html += `<p>${inlineMd(line)}</p>`; }
      });
      closeTo(0);
      return html;
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (err) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        (document.querySelector("dialog[open]") || document.body).appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
    }

    function flashCopied(btn, label, doneLabel = "已複製 ✓") {
      const target = btn.querySelector(".label") || btn;
      clearTimeout(btn._t);
      btn.classList.add("copied");
      target.textContent = doneLabel;
      btn._t = setTimeout(() => {
        btn.classList.remove("copied");
        target.textContent = label;
      }, 1600);
    }

      bar.innerHTML = btn("all", "全部", items.length) + cats.map(c => btn(c, c, counts[c])).join("");
      bar.querySelectorAll(".cat-btn").forEach(b => b.addEventListener("click", () => {

            </div>
            <div class="card-body">
              <div class="card-cat">${escapeHtml(item.category || "")}${t.ratio ? `<span class="ratio">${t.ratio}</span>` : ""}</div>
              <h2 class="card-title">${escapeHtml(t.zh)}</h2>
              ${t.en ? `<div class="card-sub">${escapeHtml(t.en)}</div>` : ""}
            </div>
          </article>`;
      }).join("");

      grid.querySelectorAll(".card").forEach(card => {
        card.addEventListener("click", () => openDetail(+card.dataset.idx));
        card.addEventListener("keydown", e => {
          if (e.target === card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDetail(+card.dataset.idx); }
        });
      });
      grid.querySelectorAll(".quick-copy").forEach(b => b.addEventListener("click", async e => {
        e.stopPropagation();
        await copyText(visible[+b.dataset.idx].prompt);
        flashCopied(b, "複製提示詞");
      }));
    }

    // ── 詳情面板 ──
    const dialog = document.getElementById("detail");
    let activeTab = "prompt";

    function openDetail(idx) {
      currentIndex = idx;
      renderDetail();
      if (!dialog.open) dialog.showModal();
      const id = visible[idx].id;
      if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
    }

    function closeDetail() {
      closeLightbox();
      dialog.close();
    }

    dialog.addEventListener("close", () => {
      if (location.hash) history.replaceState(null, "", location.pathname + location.search);
      const card = document.querySelector(`.card[data-idx="${currentIndex}"]`);
      if (card) card.focus({ preventScroll: true });
    });

    function renderDetail() {
      const item = visible[currentIndex];
      const t = splitTitle(item.title);

      document.getElementById("detailCounter").textContent = `${currentIndex + 1} / ${visible.length}`;
      document.getElementById("prevBtn").disabled = currentIndex === 0;
      document.getElementById("nextBtn").disabled = currentIndex === visible.length - 1;

      document.getElementById("detailMedia").innerHTML = `
        <div class="frame${item.image ? " zoomable" : ""}" ${item.image ? `role="button" tabindex="0" aria-label="放大預覽"` : ""}>
          ${posterHtml(item)}
          ${item.image ? `<span class="zoom-hint">點擊放大</span>` : `<span class="card-badge">概念預覽 · 待補成果圖</span>`}
        </div>`;
      const frame = document.querySelector("#detailMedia .zoomable");
      if (frame) {
        frame.addEventListener("click", () => openLightbox(item.image));
        frame.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLightbox(item.image); } });
      }

      const modules = parsePrompt(item.prompt);
      const tabsHtml = [["prompt", "提示詞"], ["md", "中文解析"], ["json", "JSON"]]
        .map(([k, l]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${k === activeTab}">${l}</button>`).join("");

      let panel = "";
      if (activeTab === "prompt") {
        panel = modules.map((m, i) => `
          <details class="module" open>
            <summary>
              <span class="chev" aria-hidden="true">▶</span>
              <span class="mod mod-${moduleKind(m.name)}">${escapeHtml(m.name || "PROMPT")}</span>
              <button class="mod-copy" data-mod="${i}"><span class="label">複製</span></button>
            </summary>
            <pre>${escapeHtml(m.body)}</pre>
          </details>`).join("");
      } else if (activeTab === "md") {
        panel = `<div class="md">${renderMarkdown(item.markdown || "")}</div>`;
      } else {
        panel = `<pre class="code-block">${escapeHtml(item.json || "")}</pre>`;
      }

      const scroll = document.getElementById("detailScroll");
      scroll.innerHTML = `
        <div class="detail-cat">${escapeHtml(item.category || "")}${t.ratio ? `<span class="ratio">${t.ratio}</span>` : ""}</div>
        <h2 class="detail-title" id="detailTitle">${escapeHtml(t.zh)}</h2>
        ${t.en ? `<div class="detail-en">${escapeHtml(t.en)}</div>` : ""}
        <p class="detail-desc">${escapeHtml(item.desc)}</p>
        <div class="detail-tags">${item.tags.map(tag => `<span class="detail-tag">#${escapeHtml(tag)}</span>`).join("")}</div>
        ${item.image && item.imageCaption ? `<div class="detail-caption">${escapeHtml(item.imageCaption)}</div>` : ""}
        <div class="detail-actions">
          <button class="btn btn-primary" id="copyPrompt"><span aria-hidden="true">📋</span><span class="label">複製完整提示詞</span></button>
          <button class="btn" id="copyJson"><span class="label">複製 JSON</span></button>
        </div>
        <div class="tabs" role="tablist">${tabsHtml}</div>
        <div role="tabpanel">${panel}</div>`;

      scroll.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
        activeTab = b.dataset.tab;
        const keep = scroll.scrollTop;
        renderDetail();
        scroll.scrollTop = keep;
        scroll.querySelector(`.tab[data-tab="${activeTab}"]`).focus();
      }));
      document.getElementById("copyPrompt").addEventListener("click", async e => {
        await copyText(item.prompt);
        flashCopied(e.currentTarget, "複製完整提示詞");
      });
      document.getElementById("copyJson").addEventListener("click", async e => {
        await copyText(item.json || "");
        flashCopied(e.currentTarget, "複製 JSON");
      });
      scroll.querySelectorAll(".mod-copy").forEach(b => b.addEventListener("click", async e => {
        e.preventDefault();
        e.stopPropagation();
        const m = modules[+b.dataset.mod];
        await copyText(m.name ? `[${m.name}]\n${m.body}` : m.body);
        flashCopied(b, "複製", "✓");
      }));
    }

    function step(delta) {
      const n = currentIndex + delta;
      if (n < 0 || n >= visible.length) return;
      currentIndex = n;
      renderDetail();
      document.getElementById("detailScroll").scrollTop = 0;
      document.querySelector(".detail-grid").scrollTop = 0;
      history.replaceState(null, "", "#" + visible[n].id);
    }

    document.getElementById("prevBtn").addEventListener("click", () => step(-1));
    document.getElementById("nextBtn").addEventListener("click", () => step(1));
    document.getElementById("closeBtn").addEventListener("click", closeDetail);

    // 點背景關閉
    dialog.addEventListener("click", e => { if (e.target === dialog) closeDetail(); });

    // Esc：先關燈箱，再關面板
    dialog.addEventListener("cancel", e => {
      if (lightbox.classList.contains("active")) { e.preventDefault(); closeLightbox(); }
    });

    dialog.addEventListener("keydown", e => {
      if (lightbox.classList.contains("active")) return;
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "summary" || tag === "input" || tag === "textarea") return;
      if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
      if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
    });

    // ── Lightbox ──
    const lightbox = document.getElementById("lightbox");
    function openLightbox(src) {
      document.getElementById("lightboxImg").src = src;
      lightbox.classList.add("active");
      document.getElementById("lightboxClose").focus();
    }
    function closeLightbox() {
      if (!lightbox.classList.contains("active")) return;
      lightbox.classList.remove("active");
      const f = document.querySelector("#detailMedia .zoomable");
      if (f) f.focus({ preventScroll: true });
    }
    lightbox.addEventListener("click", closeLightbox);

    // ── 啟動：支援 #case-03 直接開啟 ──
    renderFilters();
    renderGallery();
    function openFromHash() {
      const id = decodeURIComponent(location.hash.slice(1));
      if (!id) return;
      const idx = visible.findIndex(i => i.id === id);
      if (idx >= 0) openDetail(idx);
    }
    openFromHash();
    window.addEventListener("hashchange", openFromHash);
  </script>

</body>
</html>
