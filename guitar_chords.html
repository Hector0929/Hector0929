<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吉他和弦速查手冊</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

        :root {
            --paper: #F4ECD8;
            --card: #FBF6E9;
            --card-border: #E3D6B4;
            --ink: #2E2013;
            --ink-soft: #6B5842;
            --wood-a: #8A5630;
            --wood-b: #3A2013;
            --brass: #C79A3E;
            --brass-light: #E7C878;
            --pearl: #F3E9CC;
            --accent: #A63A2F;
            --accent-soft: #D8C9AA;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--paper);
            background-image:
                radial-gradient(circle at 15% 8%, rgba(199, 154, 62, 0.10), transparent 45%),
                radial-gradient(circle at 85% 92%, rgba(166, 58, 47, 0.06), transparent 40%);
            color: var(--ink);
            font-family: 'Noto Sans TC', sans-serif;
            line-height: 1.6;
        }

        .page {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 20px 64px;
        }

        /* ---------- HERO ---------- */
        .hero {
            padding: 48px 4px 28px;
            position: relative;
        }

        .hero .pegs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .hero .pegs span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, var(--brass-light), var(--brass) 70%, #8a6a24);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        }

        .hero h1 {
            font-family: 'Fraunces', serif;
            font-optical-sizing: auto;
            font-weight: 700;
            font-size: clamp(32px, 5vw, 52px);
            margin: 0 0 10px;
            color: var(--ink);
            letter-spacing: 0.5px;
        }

        .hero h1 em {
            font-style: normal;
            color: var(--accent);
        }

        .hero p {
            max-width: 560px;
            color: var(--ink-soft);
            font-size: 15.5px;
            margin: 0;
        }

        .hero .legend {
            margin-top: 22px;
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            font-size: 13px;
            color: var(--ink-soft);
        }

        .hero .legend span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .mini-o,
        .mini-x,
        .mini-n {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            flex: none;
        }

        .mini-o {
            border: 1.6px solid var(--ink-soft);
            background: transparent;
        }

        .mini-x {
            color: var(--ink-soft);
            font-family: sans-serif;
        }

        .mini-n {
            background: var(--pearl);
            border: 1.6px solid var(--wood-b);
            color: var(--ink);
        }

        /* ---------- CONTROLS ---------- */
        .controls {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--paper);
            padding: 14px 4px 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 999px;
            padding: 10px 18px;
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02);
        }

        .search-row svg {
            flex: none;
            opacity: 0.55;
        }

        .search-row input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 15px;
            color: var(--ink);
        }

        .search-row input::placeholder {
            color: #9C8B6F;
        }

        .count {
            font-size: 12.5px;
            color: var(--ink-soft);
            white-space: nowrap;
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-top: 12px;
            padding-bottom: 2px;
            scrollbar-width: thin;
        }

        .tab {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 13.5px;
            font-weight: 500;
            padding: 7px 15px;
            border-radius: 999px;
            border: 1px solid var(--card-border);
            background: var(--card);
            color: var(--ink-soft);
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s, color .15s, border-color .15s;
        }

        .tab:hover {
            border-color: var(--brass);
        }

        .tab.active {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--brass-light);
        }

        /* ---------- GRID ---------- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
            gap: 16px;
            margin-top: 22px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px 14px 12px;
            cursor: pointer;
            outline-offset: 2px;
            transition: transform .12s ease, box-shadow .12s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(58, 32, 19, 0.10);
        }

        .card:focus-visible {
            outline: 2.5px solid var(--accent);
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .chord-name {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            font-size: 22px;
            margin: 0;
            color: var(--ink);
        }

        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 999px;
            letter-spacing: 0.5px;
        }

        .badge-easy {
            background: #E4EEDD;
            color: #4C7A3B;
        }

        .badge-hard {
            background: #F3DEDB;
            color: var(--accent);
        }

        .diagram {
            display: flex;
            justify-content: center;
            margin: 6px 0 4px;
        }

        .diagram svg {
            width: 100%;
            max-width: 150px;
            height: auto;
            display: block;
        }

        .cat-tag {
            text-align: center;
            font-size: 11.5px;
            color: var(--ink-soft);
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .tip {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height .25s ease, opacity .2s ease, margin-top .25s ease;
            font-size: 12.8px;
            color: var(--ink-soft);
            line-height: 1.55;
            border-top: 1px dashed var(--card-border);
            margin-top: 0;
            padding-top: 0;
        }

        .card.open .tip {
            max-height: 220px;
            opacity: 1;
            margin-top: 10px;
            padding-top: 10px;
        }

        .card.open {
            box-shadow: 0 6px 18px rgba(58, 32, 19, 0.14);
        }

        .hint {
            text-align: center;
            font-size: 11px;
            color: #A99872;
            margin-top: 2px;
        }

        .empty {
            grid-column: 1/-1;
            text-align: center;
            padding: 40px 10px;
            color: var(--ink-soft);
            font-size: 14.5px;
        }

        /* ---------- PROGRESSIONS ---------- */
        .progressions {
            margin-top: 56px;
        }

        .progressions h2 {
            font-family: 'Fraunces', serif;
            font-size: 26px;
            margin: 0 0 6px;
            color: var(--ink);
        }

        .progressions>p {
            color: var(--ink-soft);
            margin: 0 0 22px;
            font-size: 14.5px;
        }

        .prog-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 18px 18px 16px;
            margin-bottom: 16px;
        }

        .prog-card h3 {
            font-family: 'Fraunces', serif;
            font-size: 17px;
            margin: 0 0 4px;
            color: var(--ink);
        }

        .prog-card .desc {
            font-size: 13px;
            color: var(--ink-soft);
            margin: 0 0 14px;
        }

        .prog-seq {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .prog-item {
            text-align: center;
            width: 88px;
        }

        .prog-item .diagram svg {
            max-width: 82px;
        }

        .prog-item span {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            font-size: 15px;
        }

        .prog-arrow {
            color: var(--brass);
            font-size: 18px;
            margin: 0 -2px;
            opacity: 0.8;
        }

        footer.note {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
            font-size: 12.5px;
            color: #9C8B6F;
            text-align: center;
        }

        @media (max-width:520px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }

            .hero {
                padding-top: 32px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .card,
            .tip {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <div class="page">

        <header class="hero">
            <div class="pegs"><span></span><span></span><span></span><span></span><span></span><span></span></div>
            <h1>吉他和弦<em>速查</em>手冊</h1>
            <p>專為初學者設計的指法查詢工具。搜尋和弦名稱,或用下方分類快速瀏覽,點一下卡片還能看到老師的按法小提醒。</p>
            <div class="legend">
                <span><i class="mini-o">○</i> 空弦(不按也要彈)</span>
                <span><i class="mini-x">✕</i> 不彈這條弦</span>
                <span><i class="mini-n">1</i> 該用第幾根手指按(1食指 2中指 3無名指 4小指)</span>
            </div>
        </header>

        <div class="controls">
            <div class="search-row">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="7" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input id="search" type="text" placeholder="搜尋和弦,例如 C、Am、G7…" autocomplete="off">
                <span class="count" id="count"></span>
            </div>
            <div class="tabs" id="tabs"></div>
        </div>

        <main class="grid" id="grid"></main>

        <section class="progressions">
            <h2>新手常用和弦進行</h2>
            <p>學會幾個和弦後,試著練習換位,下面是幾組經典組合。</p>
            <div id="progressions"></div>
        </section>

        <footer class="note">指法為常見教學版本,實際彈奏可依手型微調 · 點按每張卡片查看按法提醒</footer>
    </div>

    <script>
        /* ---------------- CHORD DATA ---------------- */
        /* frets / fingers order: [低音E弦(6), A弦(5), D弦(4), G弦(3), B弦(2), 高音E弦(1)] */
        /* fret value: -1 = 不彈, 0 = 空弦, >0 = 第幾格 */
        /* finger value: 0 = 無 / 空弦, 1-4 = 食中無小 */

        const CATEGORY_LABEL = {
            major: '大調', minor: '小調', seventh: '七和弦', sus: '掛留和弦', extended: '附加音', barre: '封閉和弦'
        };

        const CHORDS = [
            {
                name: 'C', category: 'major', difficulty: '入門',
                frets: [-1, 3, 2, 0, 1, 0], fingers: [0, 3, 2, 0, 1, 0],
                tip: '無名指按A弦第3格、中指按D弦第2格、食指按B弦第1格,低音E弦不要彈到,G弦與高音E弦保持空弦。'
            },
            {
                name: 'G', category: 'major', difficulty: '入門',
                frets: [3, 2, 0, 0, 0, 3], fingers: [3, 2, 0, 0, 0, 4],
                tip: '無名指按低音E弦第3格、中指按A弦第2格、小指伸到高音E弦第3格,中間的D、G、B弦保持空弦刷響。'
            },
            {
                name: 'D', category: 'major', difficulty: '入門',
                frets: [-1, -1, 0, 2, 3, 2], fingers: [0, 0, 0, 1, 3, 2],
                tip: '食指按G弦第2格、中指按高音E弦第2格、無名指按B弦第3格,三指集中在前三弦形成小三角形,低音E弦和A弦都不要彈到。'
            },
            {
                name: 'A', category: 'major', difficulty: '入門',
                frets: [-1, 0, 2, 2, 2, 0], fingers: [0, 0, 1, 2, 3, 0],
                tip: '食指、中指、無名指並排平壓在D、G、B弦的第2格,盡量讓手指立起來,避免悶住旁邊的弦,低音E弦不要彈到。'
            },
            {
                name: 'E', category: 'major', difficulty: '入門',
                frets: [0, 2, 2, 1, 0, 0], fingers: [0, 2, 3, 1, 0, 0],
                tip: '中指按A弦第2格、無名指按D弦第2格、食指按G弦第1格,六條弦全部刷下去都會發出聲音,是最容易上手的大調和弦之一。'
            },
            {
                name: 'F', category: 'barre', difficulty: '進階',
                frets: [1, 3, 3, 2, 1, 1], fingers: [1, 3, 4, 2, 1, 1],
                barre: { fret: 1, from: 6, to: 1, finger: 1 },
                tip: '食指平壓第1格封住全部六條弦,無名指按D弦第3格、小指按G弦第3格、中指按B弦第2格,初學可先只用食指封閉前兩弦練習過渡。'
            },
            {
                name: 'Am', category: 'minor', difficulty: '入門',
                frets: [-1, 0, 2, 2, 1, 0], fingers: [0, 0, 2, 3, 1, 0],
                tip: '中指按D弦第2格、無名指按G弦第2格、食指按B弦第1格,形狀跟C和弦很像,只差在低音E弦不要彈到。'
            },
            {
                name: 'Em', category: 'minor', difficulty: '入門',
                frets: [0, 2, 2, 0, 0, 0], fingers: [0, 2, 3, 0, 0, 0],
                tip: '中指按A弦第2格、無名指按D弦第2格,其餘弦全部空弦,是最簡單的和弦之一,很適合當刷弦練習的起點。'
            },
            {
                name: 'Dm', category: 'minor', difficulty: '入門',
                frets: [-1, -1, 0, 2, 3, 1], fingers: [0, 0, 0, 2, 3, 1],
                tip: '食指按高音E弦第1格、中指按G弦第2格、無名指按B弦第3格,注意低音E弦和A弦都不要彈到。'
            },
            {
                name: 'Bm', category: 'barre', difficulty: '進階',
                frets: [-1, 2, 4, 4, 3, 2], fingers: [0, 1, 3, 4, 2, 1],
                barre: { fret: 2, from: 5, to: 1, finger: 1 },
                tip: '食指平壓第2格,從A弦一路封到高音E弦,無名指按D弦第4格、小指按G弦第4格、中指按B弦第3格,是繼F和弦後常見的第二個封閉和弦。'
            },
            {
                name: 'C7', category: 'seventh', difficulty: '入門',
                frets: [-1, 3, 2, 3, 1, 0], fingers: [0, 3, 2, 4, 1, 0],
                tip: '在C和弦的指法上,小指多按G弦第3格,其餘手指位置不變,是很好的過渡練習。'
            },
            {
                name: 'G7', category: 'seventh', difficulty: '入門',
                frets: [3, 2, 0, 0, 0, 1], fingers: [3, 2, 0, 0, 0, 1],
                tip: '無名指按低音E弦第3格、中指按A弦第2格、食指按高音E弦第1格,比G和弦少壓一根弦,更好按。'
            },
            {
                name: 'D7', category: 'seventh', difficulty: '入門',
                frets: [-1, -1, 0, 2, 1, 2], fingers: [0, 0, 0, 3, 1, 2],
                tip: '食指按B弦第1格、中指按高音E弦第2格、無名指按G弦第2格,注意食指和中指分別按在不相鄰的弦上。'
            },
            {
                name: 'A7', category: 'seventh', difficulty: '入門',
                frets: [-1, 0, 2, 0, 2, 0], fingers: [0, 0, 1, 0, 2, 0],
                tip: '食指按D弦第2格、中指按B弦第2格,兩指分開按在不相鄰的兩條弦上,比A和弦簡單許多。'
            },
            {
                name: 'E7', category: 'seventh', difficulty: '入門',
                frets: [0, 2, 0, 1, 0, 0], fingers: [0, 2, 0, 1, 0, 0],
                tip: '中指按A弦第2格、食指按G弦第1格,只需要兩根手指,是新手最快能彈熟的和弦之一。'
            },
            {
                name: 'B7', category: 'seventh', difficulty: '進階',
                frets: [-1, 2, 1, 2, 0, 2], fingers: [0, 2, 1, 3, 0, 4],
                tip: '食指按D弦第1格、中指按A弦第2格、無名指按G弦第2格、小指按高音E弦第2格,四指全用上,是很好的手指伸展練習。'
            },
            {
                name: 'Am7', category: 'seventh', difficulty: '入門',
                frets: [-1, 0, 2, 0, 1, 0], fingers: [0, 0, 2, 0, 1, 0],
                tip: '中指按D弦第2格、食指按B弦第1格,是Am和弦拿掉一根手指的簡化版,非常好按。'
            },
            {
                name: 'Em7', category: 'seventh', difficulty: '入門',
                frets: [0, 2, 0, 0, 0, 0], fingers: [0, 2, 0, 0, 0, 0],
                tip: '只需要中指按住A弦第2格,其餘全部空弦,是所有和弦中最容易的一個。'
            },
            {
                name: 'Cmaj7', category: 'seventh', difficulty: '入門',
                frets: [-1, 3, 2, 0, 0, 0], fingers: [0, 3, 2, 0, 0, 0],
                tip: '無名指按A弦第3格、中指按D弦第2格,比C和弦少壓一根弦,聲音更柔和。'
            },
            {
                name: 'Dsus2', category: 'sus', difficulty: '入門',
                frets: [-1, -1, 0, 2, 3, 0], fingers: [0, 0, 0, 1, 2, 0],
                tip: '食指按G弦第2格、中指按B弦第3格,把D和弦拿掉無名指、中指往下移一格就是這個和弦。'
            },
            {
                name: 'Dsus4', category: 'sus', difficulty: '入門',
                frets: [-1, -1, 0, 2, 3, 3], fingers: [0, 0, 0, 1, 2, 3],
                tip: '食指按G弦第2格、中指和無名指分別按住B弦與高音E弦的第3格,聲音比D和弦更有張力,常用來製造想解決的感覺。'
            },
            {
                name: 'Asus2', category: 'sus', difficulty: '入門',
                frets: [-1, 0, 2, 2, 0, 0], fingers: [0, 0, 1, 2, 0, 0],
                tip: '食指按D弦第2格、中指按G弦第2格,把A和弦最高音的手指拿掉就完成了。'
            },
            {
                name: 'Asus4', category: 'sus', difficulty: '入門',
                frets: [-1, 0, 2, 2, 3, 0], fingers: [0, 0, 1, 2, 3, 0],
                tip: '食指按D弦第2格、中指按G弦第2格、無名指按B弦第3格,常用在歌曲前奏,製造懸而未解的感覺。'
            },
            {
                name: 'Cadd9', category: 'extended', difficulty: '入門',
                frets: [-1, 3, 2, 0, 3, 0], fingers: [0, 3, 2, 0, 4, 0],
                tip: '在C和弦的指法上,小指多按B弦第3格,是民謠彈唱很常見的裝飾和弦。'
            },
        ];

        /* ---------------- SVG DIAGRAM BUILDER ---------------- */
        const M_LEFT = 25, M_TOP = 44, STR_GAP = 20, FRET_GAP = 26, FRETS_SHOWN = 5;
        const BOARD_RIGHT = M_LEFT + 5 * STR_GAP;
        const BOARD_BOTTOM = M_TOP + FRETS_SHOWN * FRET_GAP;
        const STRING_WIDTHS = [2.8, 2.4, 2.0, 1.7, 1.4, 1.1];

        function chordSvg(chord) {
            let s = `<svg viewBox="0 0 150 190" xmlns="http://www.w3.org/2000/svg">`;

            // wood background
            s += `<defs><linearGradient id="wg-${chord.name}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8A5630"/><stop offset="1" stop-color="#3A2013"/>
  </linearGradient></defs>`;
            s += `<rect x="9" y="20" width="132" height="170" rx="8" fill="url(#wg-${chord.name})"/>`;
            s += `<path d="M18,40 Q75,28 132,52" stroke="#000" stroke-opacity="0.12" stroke-width="3" fill="none"/>`;
            s += `<path d="M16,150 Q75,168 134,146" stroke="#000" stroke-opacity="0.10" stroke-width="3" fill="none"/>`;

            // nut
            s += `<line x1="${M_LEFT}" y1="${M_TOP}" x2="${BOARD_RIGHT}" y2="${M_TOP}" stroke="#F4E9CE" stroke-width="5"/>`;

            // frets
            for (let i = 1; i <= FRETS_SHOWN; i++) {
                const y = M_TOP + i * FRET_GAP;
                s += `<line x1="${M_LEFT}" y1="${y}" x2="${BOARD_RIGHT}" y2="${y}" stroke="#C79A3E" stroke-width="2" stroke-opacity="0.85"/>`;
            }

            // strings
            for (let i = 0; i < 6; i++) {
                const x = M_LEFT + i * STR_GAP;
                s += `<line x1="${x}" y1="${M_TOP}" x2="${x}" y2="${BOARD_BOTTOM}" stroke="#EFE6D2" stroke-width="${STRING_WIDTHS[i]}"/>`;
            }

            // open / mute marks
            for (let i = 0; i < 6; i++) {
                const x = M_LEFT + i * STR_GAP;
                const y = M_TOP - 15;
                if (chord.frets[i] === 0) {
                    s += `<circle cx="${x}" cy="${y}" r="6" fill="none" stroke="#2E2013" stroke-width="1.6"/>`;
                } else if (chord.frets[i] === -1) {
                    s += `<g stroke="#2E2013" stroke-width="1.8" stroke-linecap="round">
        <line x1="${x - 5}" y1="${y - 5}" x2="${x + 5}" y2="${y + 5}"/>
        <line x1="${x - 5}" y1="${y + 5}" x2="${x + 5}" y2="${y - 5}"/>
      </g>`;
                }
            }

            // barre
            if (chord.barre) {
                const idxA = 6 - chord.barre.from, idxB = 6 - chord.barre.to;
                const xMin = M_LEFT + Math.min(idxA, idxB) * STR_GAP;
                const xMax = M_LEFT + Math.max(idxA, idxB) * STR_GAP;
                const y = M_TOP + (chord.barre.fret - 0.5) * FRET_GAP;
                s += `<rect x="${xMin - 9}" y="${y - 9}" width="${(xMax - xMin) + 18}" height="18" rx="9" fill="#F3E9CC" stroke="#2E2013" stroke-width="1.5"/>`;
                s += `<text x="${(xMin + xMax) / 2}" y="${y + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#2E2013" font-family="Noto Sans TC, sans-serif">${chord.barre.finger}</text>`;
            }

            // finger dots
            for (let i = 0; i < 6; i++) {
                const fret = chord.frets[i], finger = chord.fingers[i];
                if (fret <= 0) continue;
                if (chord.barre && fret === chord.barre.fret && finger === chord.barre.finger) continue;
                const x = M_LEFT + i * STR_GAP;
                const y = M_TOP + (fret - 0.5) * FRET_GAP;
                s += `<circle cx="${x}" cy="${y}" r="9" fill="#F3E9CC" stroke="#2E2013" stroke-width="1.5"/>`;
                if (finger > 0) {
                    s += `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#2E2013" font-family="Noto Sans TC, sans-serif">${finger}</text>`;
                }
            }

            s += `</svg>`;
            return s;
        }

        /* ---------------- RENDERING ---------------- */
        const grid = document.getElementById('grid');
        const countEl = document.getElementById('count');
        const searchInput = document.getElementById('search');
        const tabsEl = document.getElementById('tabs');

        const state = { category: 'all', query: '' };

        const TAB_ORDER = ['all', 'major', 'minor', 'seventh', 'sus', 'extended', 'barre'];
        tabsEl.innerHTML = TAB_ORDER.map(cat => {
            const label = cat === 'all' ? '全部' : CATEGORY_LABEL[cat];
            return `<button class="tab${cat === 'all' ? ' active' : ''}" data-cat="${cat}">${label}</button>`;
        }).join('');

        function cardHTML(chord) {
            const badgeClass = chord.difficulty === '入門' ? 'badge-easy' : 'badge-hard';
            return `<article class="card" data-name="${chord.name}" tabindex="0" role="button" aria-expanded="false" aria-label="${chord.name} 和弦,${chord.difficulty}">
    <div class="card-top">
      <h3 class="chord-name">${chord.name}</h3>
      <span class="badge ${badgeClass}">${chord.difficulty}</span>
    </div>
    <div class="diagram">${chordSvg(chord)}</div>
    <div class="cat-tag">${CATEGORY_LABEL[chord.category]}</div>
    <div class="hint">點一下查看按法提醒</div>
    <div class="tip">${chord.tip}</div>
  </article>`;
        }

        function render() {
            const q = state.query.trim().toLowerCase();
            const filtered = CHORDS.filter(c =>
                (state.category === 'all' || c.category === state.category) &&
                c.name.toLowerCase().includes(q)
            );
            grid.innerHTML = filtered.length
                ? filtered.map(cardHTML).join('')
                : `<div class="empty">找不到符合「${state.query}」的和弦,換個關鍵字試試看吧。</div>`;
            countEl.textContent = filtered.length ? `${filtered.length} 個和弦` : '';
        }

        grid.addEventListener('click', e => {
            const card = e.target.closest('.card');
            if (!card) return;
            const open = card.classList.toggle('open');
            card.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        grid.addEventListener('keydown', e => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const card = e.target.closest('.card');
            if (!card) return;
            e.preventDefault();
            const open = card.classList.toggle('open');
            card.setAttribute('aria-expanded', open ? 'true' : 'false');
        });

        tabsEl.addEventListener('click', e => {
            const btn = e.target.closest('.tab');
            if (!btn) return;
            state.category = btn.dataset.cat;
            tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === btn));
            render();
        });

        searchInput.addEventListener('input', e => {
            state.query = e.target.value;
            render();
        });

        render();

        /* ---------------- PROGRESSIONS ---------------- */
        const PROGRESSIONS = [
            { title: '新手第一組合', desc: '只要練熟這4個和弦,就能彈奏非常多流行歌曲的伴奏。', chords: ['C', 'G', 'Am', 'F'] },
            { title: '民謠彈唱基礎', desc: '順階往下走的和弦組合,適合練習換和弦的手感。', chords: ['G', 'D', 'Em', 'C'] },
            { title: '小調感進行', desc: '從小調和弦出發,情緒感較重,許多抒情歌曲愛用。', chords: ['Am', 'F', 'C', 'G'] },
        ];

        function findChord(name) { return CHORDS.find(c => c.name === name); }

        document.getElementById('progressions').innerHTML = PROGRESSIONS.map(p => {
            const seq = p.chords.map((name, i) => {
                const c = findChord(name);
                const arrow = i > 0 ? `<span class="prog-arrow">→</span>` : '';
                return `${arrow}<div class="prog-item"><div class="diagram">${chordSvg(c)}</div><span>${c.name}</span></div>`;
            }).join('');
            return `<div class="prog-card">
    <h3>${p.title}</h3>
    <p class="desc">${p.desc}</p>
    <div class="prog-seq">${seq}</div>
  </div>`;
        }).join('');
    </script>
</body>

</html>
